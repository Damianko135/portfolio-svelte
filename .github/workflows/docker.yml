name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository
      - uses: actions/checkout@v4

      # 2. Set up QEMU for multi-platform builds
      - uses: docker/setup-qemu-action@v3

      # 3. Set up Buildx (needed for caching + multi-platform)
      - uses: docker/setup-buildx-action@v3

      # 4. Cache Docker layers (huge build speed-up)
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      # 5. Log in to Docker registry
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 6. Lowercase the repository name safely
      - name: Lowercase the repo name
        run: echo "REPO_LC=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 7. Generate a short SHA
      - name: Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 8. Fetch all tags for semantic versioning
      - name: Fetch all tags
        run: git fetch --tags --force

      # 9. Semantic versioning (either from tags or fallback to run number)
      - name: Generate version
        id: version
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$TAG" ]; then
            VERSION="$TAG"
            echo "Using tag version: $VERSION"
          else
            RUN_NUMBER=${{ github.run_number }}
            MAJOR=$((RUN_NUMBER / 100))
            MINOR=$(((RUN_NUMBER % 100) / 10))
            PATCH=$((RUN_NUMBER % 10))
            VERSION="$MAJOR.$MINOR.$PATCH"
            echo "No tag found, using calculated version: $VERSION (from run #$RUN_NUMBER)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 9. Build and push Docker image with caching
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REPO_LC }}:latest
            ${{ env.REPO_LC }}:${{ env.VERSION }}
            ${{ env.REPO_LC }}:${{ env.VERSION }}-${{ env.SHORT_SHA }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
