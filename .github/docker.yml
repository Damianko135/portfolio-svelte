name: Build and Push Docker Image (GHCR)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push images to GHCR

    steps:
      # 1. Check out the repository
      - uses: actions/checkout@v4

      # 2. Set up QEMU for multi-platform builds
      - uses: docker/setup-qemu-action@v3

      # 3. Set up Buildx (needed for caching + multi-platform)
      - uses: docker/setup-buildx-action@v3

      # 4. Cache Docker layers (huge build speed-up)
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docker-

      # 5. Log in to GitHub Container Registry (no manual secrets required)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Derive lowercase image name (ghcr.io/<owner>/<repo>)
      - name: Derive image name
        run: |
          REPO_LC=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LC=${REPO_LC}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${REPO_LC}" >> "$GITHUB_ENV"

      # 7. Generate a short SHA
      - name: Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 8. Fetch all tags for semantic versioning
      - name: Fetch all tags
        run: git fetch --tags --force

      # 9. Semantic versioning (tag-based; fallback to derived number)
      - name: Generate version
        id: version
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$TAG" ]; then
            VERSION="$TAG"
            echo "Using tag version: $VERSION"
          else
            RUN_NUMBER=${{ github.run_number }}
            MAJOR=$((RUN_NUMBER / 100))
            MINOR=$(((RUN_NUMBER % 100) / 10))
            PATCH=$((RUN_NUMBER % 10))
            VERSION="$MAJOR.$MINOR.$PATCH"
            echo "No tag found, using calculated version: $VERSION (from run #$RUN_NUMBER)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 10. Build and push Docker image to GHCR with caching
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ env.SHORT_SHA }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
